name: Publish Package to npmjs

on:
  push:
    branches:
      - main
      - next

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --force && npm run build

      - run: |
          cp ./package.json ./dist/
          cp ./Readme.md ./dist/
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > ./dist/.npmrc

      # Resolve version: different strategy per branch
      - name: Resolve version (main — patch bump)
        if: github.ref == 'refs/heads/main'
        run: |
          set -x
          rm -rf assets/src test node_modules docs
          find . -type f -name '*.ts' ! -name '*.d.ts' -delete
          PACKAGE=$(jq -r '.name' package.json)
          VERNPM=$(curl -s https://registry.npmjs.org/$PACKAGE | jq -r '.["dist-tags"].latest' | awk -F. -v OFS=. '{$NF += 1 ; print}')
          VERLOC=$(jq -r '.version' package.json)
          VEROUT=$(printf "$VERNPM\n$VERLOC\n" | sort -V -r | awk 'NR==1 {print; exit}')
          jq -r --arg VER "$VEROUT" '.version = $VER' package.json > /tmp/package.json && mv /tmp/package.json ./package.json
        working-directory: ./dist

      - name: Resolve version (next — prerelease build bump)
        if: github.ref == 'refs/heads/next'
        run: |
          set -x
          BRANCH=${GITHUB_REF##*/}
          PACKAGE=$(jq -r '.name' package.json)
          VERLOC=$(jq -r '.version' package.json)
          VERNPMRAW=$(curl -s https://registry.npmjs.org/$PACKAGE | jq -r '.["dist-tags"].'$BRANCH'')
          BUILD_VERSION=0
          if [[ "$VERNPMRAW" == "null" ]]; then
              VEROUT=$VERLOC
          else
              VERNPM=$(echo $VERNPMRAW | cut -d'-' -f1)
              BUILD_VERSION=$(echo $VERNPMRAW | awk -F '[.-]' '{print $5+1}')
              VEROUT=$(printf "$VERNPM\n$VERLOC\n" | sort -V -r | awk 'NR==1 {print; exit}')
          fi
          jq -r --arg VER "${VEROUT}-build.${BUILD_VERSION}" '.version = $VER' package.json > /tmp/package.json && mv /tmp/package.json ./package.json
        working-directory: ./dist

      # Publish: main as latest, next with --tag next
      - name: Publish (main)
        if: github.ref == 'refs/heads/main'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: ./dist

      - name: Publish (next)
        if: github.ref == 'refs/heads/next'
        run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: ./dist
